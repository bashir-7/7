<!DOCTYPE html>
<html manifest="slopkit.manifest" lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مركز بشير لصيانة وتعديل الأجهزة الإلكترونية</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <div class="status-card">
        <span class="loader"></span>
        <h2 id="msgs" class="status-message">بدء تثبيت ذاكرة التخزين المؤقت...</h2>
    </div>
</div>

<script>
setTimeout(function(){
    if (history.length > 1) {
        history.replaceState(null, null, 'index.html');
    }
}, 500);

var msgs = document.getElementById('msgs');

function DLProgress(e){
    if (e.total) {
        var Percent = Math.round((e.loaded / e.total) * 100);
        msgs.innerHTML = "تثبيت ذاكرة التخزين المؤقت: " + Percent + "%";
    } else {
        msgs.innerHTML = "بدء تثبيت ذاكرة التخزين المؤقت...";
    }
}

function DisplayCacheProgress(){
    msgs.innerHTML = "تم تثبيت ذاكرة التخزين المؤقت بنجاح ✔";
    setTimeout(function(){
        msgs.innerHTML = "أغلق متصفحك ثم أعد فتحه ...";
    }, 1500);
}

if (window.applicationCache) {
    window.applicationCache.addEventListener("progress", DLProgress, false);
    window.applicationCache.oncached = function(e){ DisplayCacheProgress(); };
    window.applicationCache.onupdateready = function(e){ DisplayCacheProgress(); };
    window.applicationCache.onerror = function(e){ 
        msgs.innerHTML = "حدث خطأ أثناء تثبيت ذاكرة التخزين المؤقت!"; 
    };
}
</script>

</body>
</html>
